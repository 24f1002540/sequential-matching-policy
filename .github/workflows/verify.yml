name: Verify participant release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python verify_data.py
      - run: python evaluate.py --seeds 101 --output results/smoke.json
      - run: docker build -t sequential-policy:ci .
      - run: python evaluate.py --image sequential-policy:ci --seeds 101 --output results/container.json
